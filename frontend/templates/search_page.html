<!DOCTYPE html>
<html>

<head>
<style>
.parent {
    display: flex;
    justify-content: center;  
    align-items: center;      
    height: 100vh;
    font-size: 20px;
}

.content {
    text-align: center;
}
</style>
</head>

<body>
<div class="parent">
    <div class="content">
        <h3>Enter search query</h3>
        <form method="post" action="/results">
            <input type="text" name="query" required style="width: 500px; height: 30px; font-size: 16px;" placeholder="What's on your mind">
            <br><br>
            <input type="submit" value="Submit" required style="width: 100px; height: 20px; font-size: 16px">
        </form>
    </div>
</div>

</body>
</html>
